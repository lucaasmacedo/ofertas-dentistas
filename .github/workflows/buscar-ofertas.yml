# Robô do GitHub que BUSCA as ofertas pela API do Mercado Livre (sem navegador).
# Dispara sozinho sempre que dados/busca_pendente.json muda no GitHub.
# Entrega: o resultado vai para o branch "busca" (candidatos.json + log.txt),
# SUBSTITUÍDO a cada execução. O Claude busca esse branch e segue a rodada.
name: Buscar ofertas (API)

on:
  push:
    paths:
      - dados/busca_pendente.json
  workflow_dispatch: {}   # permite rodar na mão pela aba Actions

permissions:
  contents: write         # necessário para gravar o branch "busca"

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar na API
        env:
          ML_TOKEN: ${{ secrets.ML_TOKEN }}   # opcional; vazio se não existir
        run: python scripts/buscar_api.py
      - name: Entregar no branch "busca"
        if: always()        # entrega o log mesmo se a busca falhar
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p busca_resultado && cd busca_resultado
          git init -q -b busca
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q --allow-empty -m "Busca da rodada (${{ github.sha }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" busca
