# Robô do GitHub que baixa as imagens das ofertas.
# Dispara sozinho sempre que dados/imagens_pendentes.csv muda no GitHub.
# Entrega: as imagens vão para o branch "imagens", que é SUBSTITUÍDO a cada
# execução (guarda só a última leva, para o repositório não ficar pesado).
# O Claude busca esse branch e sobe as imagens no Painel de Ofertas.
name: Baixar imagens das ofertas

on:
  push:
    paths:
      - dados/imagens_pendentes.csv
  workflow_dispatch: {}   # permite rodar na mão pela aba Actions

permissions:
  contents: write         # necessário para gravar o branch "imagens"

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/baixar_imagens.py
      - name: Entregar no branch "imagens"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd imagens_baixadas
          git init -q -b imagens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Imagens da rodada (${{ github.sha }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" imagens
